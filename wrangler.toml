name = "twitter-archive"
main = "src/worker/index.ts"
compatibility_date = "2026-09-29"

[version_metadata]
binding = "CF_VERSION_METADATA"

[triggers]
crons = ["*/30 * * * *", "* * * * *"]

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/media/*", "/owner"]

[vars]
SITE_TITLE = "Tweet Archive"
SEARCH_DAILY_LIMIT = "200"
ACCOUNT_HANDLE = ""
OWNER_EMAILS = ""
OWNER_SERVICE_TOKEN_IDS = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
SCORE_BATCH = "400"
X_USER_ID = ""
JEV_MONTHLY_USD_CAP = "5"
SOURCE_URL = "https://github.com/eiaserinnys/twitter-archive"

[[d1_databases]]
binding = "DB"
database_name = "twitter-archive"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "twitter-archive-media"
